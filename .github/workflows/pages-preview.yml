name: Publish installable web preview
on:
  push:
    branches: ["feat/gpt6-planning-foundation", "feat/elite-cuts-operational-mvp"]
    paths: ["index.html", "manifest.webmanifest", "sw.js", ".github/workflows/pages-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
